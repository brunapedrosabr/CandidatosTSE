<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Candidatos TSE 2026 - MG</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topo">
    <h1>Perfil dos Candidatos - Eleições 2026 - MG</h1>
    <h4>Filtre por gênero, escolaridade e faixa etária</h4>    
</header>

<main class="container">

    <!-- Formulário de filtro: GET simples, sem JavaScript. -->
    <form method="get" th:action="@{/}" class="filtros">

        <div class="campo">
            <label>
                <input type="radio" name="genero" value="" th:checked="${generoSelecionado == ''}">
                Todos
            </label>
            <label th:each="g : ${generos}">
                <input type="radio" name="genero" th:value="${g}" th:checked="${g == generoSelecionado}">
                <span th:text="${g}">Gênero</span>
            </label>
        </div>

        <div class="campo">
            <label for="escolaridade">Escolaridade</label>
            <select id="escolaridade" name="escolaridade">
                <option value="" th:selected="${escolaridadeSelecionada == ''}">Todos</option>
                <option th:each="e : ${escolaridades}"
                        th:value="${e}"
                        th:text="${e}"
                        th:selected="${e == escolaridadeSelecionada}"></option>
            </select>
        </div>

        <div class="campo">
            <label for="texto">Faixa etária</label>
            <input type="number" name="idadeMin" th:value="${idadeMin}" placeholder="De">
            <label for="ate">até</label>
            <input type="number" name="idadeMax" th:value="${idadeMax}" placeholder="Até">
        </div>

        <div class="campo botoes">
            <button type="submit">Filtrar</button>
            <a th:href="@{/}" class="limpar">Limpar</a>
        </div>
    </form>

    <p class="resultado-info">
        <span th:text="${totalEncontrado}">0</span> candidato(s) encontrado(s).
    </p>

    <div class="grade-candidatos">
        <div class="card" th:each="cand : ${candidatos}">

            <img th:src="@{'/images/candidatos/' + ${cand.nomeArquivoFoto}}"
                 th:alt="${cand.nomeUrna}"
                 onerror="this.onerror=null;this.src='/images/candidatos/sem-foto.jpg';"
                 class="foto-candidato">

            <div class="card-info">
                <h2 th:text="${cand.nomeUrna}">Nome de Urna</h2>
                <p class="numero" th:text="${'Número: ' + cand.nrCandidato}">Número</p>
                <p><strong th:text="${cand.cargo}">Cargo</strong></p>
                <p th:text="${cand.siglaPartido + ' - ' + cand.nomePartido}">Partido</p>
                <p class="municipio" th:text="${cand.municipio}">Município</p>
                <p class="situacao"
                   th:if="${cand.situacaoCandidatura != null
                           and cand.situacaoCandidatura != '#NE'
                           and cand.situacaoCandidatura != '#NULO'
                           and !cand.situacaoCandidatura.isBlank()}"
                   th:text="${cand.situacaoCandidatura}">Situação</p>

                <p class="extra" th:if="${cand.idade > 0}">
                    <span th:text="${cand.idade + ' anos'}">idade</span>
                </p>
                <p class="extra"
                   th:if="${cand.ocupacao != null and cand.ocupacao != '#NULO' and !cand.ocupacao.isBlank()}"
                   th:text="${cand.ocupacao}">Ocupação</p>
                <p class="extra"
                   th:if="${cand.grauInstrucao != null and cand.grauInstrucao != '#NULO' and !cand.grauInstrucao.isBlank()}"
                   th:text="${cand.grauInstrucao}">Escolaridade</p>

                <p class="detalhes" th:text="${cand.nomeCandidato}">Nome civil</p>
            </div>
        </div>
    </div>

    <p th:if="${totalEncontrado == 0}" class="sem-resultado">
        Nenhum candidato encontrado com esses filtros.
    </p>

</main>

</body>
</html>
